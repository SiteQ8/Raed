name: update

on:
  schedule:
    # Changing this line makes GitHub register the schedule again; it had not fired since the repository was created.
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild the whole 30 day window
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/**'
      - 'docs/assets/**'
      - 'advisories/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the test tools
        run: npm ci --no-audit --no-fund

      - name: Fetch new and changed CVE records, KEV and EPSS
        run: node scripts/update.mjs ${{ inputs.full && '--full' || '' }}

      - name: Refresh the CNA list
        run: node scripts/cnas.mjs

      - name: Write any completed weekly digest
        run: node scripts/weekly.mjs

      - name: Build the pages
        run: node scripts/build.mjs

      - name: Test
        run: node --test tests/site.test.mjs

      - name: Commit
        run: |
          git config user.name "SiteQ8"
          git config user.email "311682+SiteQ8@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          stamp=$(node -e "console.log(require('./docs/data/index.json').generated)")
          git commit -q -m "Records as of ${stamp}"
          for n in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
